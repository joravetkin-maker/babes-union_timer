<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Babes Union Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:transparent;
}

body{
  width:100%;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:transparent;
  overflow:hidden;

  font-family:'Geologica',sans-serif;
}

/* ===== ВИДЖЕТ ===== */

.widget{
  position:relative;

  width:320px;
  height:320px;

  overflow:hidden;

  border-radius:0px;

  background-image:url("https://i.ibb.co/JRbwjdX7/Chat-GPT-Image-19-2026-19-21-53.png");
  background-size:cover;
  background-position:center;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== ТАЙМЕР ===== */

.timer{
  position:absolute;

  width:210px;

  left:50%;
  top:57%;

  transform:translate(-50%,-50%);

  text-align:center;
}

/* ===== ОБЩИЙ КОНТУР ===== */

.title,
.subtitle,
.number,
.label,
.deadline{

  color:white;

  text-shadow:
    0 2px 0 #000,
    0 -2px 0 #000,
    2px 0 0 #000,
   -2px 0 0 #000,
    1px 1px 0 #000,
   -1px -1px 0 #000,
    1px -1px 0 #000,
   -1px 1px 0 #000;

}

/* ===== ЗАГОЛОВОК ===== */

.title{
  font-size:20px;
  font-weight:800;
  line-height:0.95;

  margin-bottom:18px;
}

/* ===== ПОДЗАГОЛОВОК ===== */

.subtitle{
  font-size:15px;
  font-weight:700;

  margin-bottom:20px;
}

/* ===== ЦИФРЫ ===== */

.numbers{
  display:flex;
  justify-content:center;

  gap:20px;

  margin-bottom:25px;
}

.item{
  width:82px;
}

/* ===== САМИ ЦИФРЫ ===== */

.number{
  font-size:35px;
  font-weight:800;
  line-height:0.9;

  margin-bottom:1px;
}

/* ===== ПОДПИСИ ===== */

.label{
  font-size:13px;
  font-weight:700;

  text-transform:uppercase;
}

/* ===== ДЕДЛАЙН ===== */

.deadline{
  font-size:16px;
  font-weight:700;
  line-height:1.2;
}

</style>
</head>

<body>

<div class="widget">

  <div class="timer">

    <div class="title" id="periodTitle">
      ОТЧЁТ<br>16–22 МАЯ
    </div>

    <div class="subtitle">
      ⛓️ Осталось до сдачи:
    </div>

    <div class="numbers">

      <div class="item">
        <div class="number" id="days">00</div>
        <div class="label">дни</div>
      </div>

      <div class="item">
        <div class="number" id="hours">00</div>
        <div class="label">часы</div>
      </div>

      <div class="item">
        <div class="number" id="minutes">00</div>
        <div class="label">минуты</div>
      </div>

      <div class="item">
        <div class="number" id="seconds">00</div>
        <div class="label">секунды</div>
      </div>

    </div>

    <div class="deadline" id="deadlineText">
      ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
    </div>

  </div>

</div>

<script>

function getCurrentPeriod(){

  const now = new Date();

  const year = now.getFullYear();
  const month = now.getMonth();
  const day = now.getDate();

  let start,end;

  if(day <= 7){
    start = 1;
    end = 7;
  }

  else if(day <= 15){
    start = 8;
    end = 15;
  }

  else if(day <= 22){
    start = 16;
    end = 22;
  }

  else{
    start = 23;

    const lastDay = new Date(year, month + 1, 0).getDate();
    end = lastDay;
  }

  return {start,end};
}

function updateTimer(){

  const now = new Date();

  const months = [
    "ЯНВАРЯ",
    "ФЕВРАЛЯ",
    "МАРТА",
    "АПРЕЛЯ",
    "МАЯ",
    "ИЮНЯ",
    "ИЮЛЯ",
    "АВГУСТА",
    "СЕНТЯБРЯ",
    "ОКТЯБРЯ",
    "НОЯБРЯ",
    "ДЕКАБРЯ"
  ];

  const period = getCurrentPeriod();

  const deadline = new Date(
    now.getFullYear(),
    now.getMonth(),
    period.end,
    21,0,0
  );

  const diff = deadline - now;

  const days = Math.floor(diff / (1000*60*60*24));

  const hours = Math.floor(
    (diff / (1000*60*60)) % 24
  );

  const minutes = Math.floor(
    (diff / (1000*60)) % 60
  );

  const seconds = Math.floor(
    (diff / 1000) % 60
  );

  document.getElementById("days").innerText =
    String(days).padStart(2,"0");

  document.getElementById("hours").innerText =
    String(hours).padStart(2,"0");

  document.getElementById("minutes").innerText =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").innerText =
    String(seconds).padStart(2,"0");

  document.getElementById("periodTitle").innerHTML =
    `ОТЧЁТ<br>${period.start}–${period.end} ${months[now.getMonth()]}`;

  document.getElementById("deadlineText").innerHTML =
    `⛓️‍💥 Дедлайн: ${period.end} ${months[now.getMonth()].toLowerCase()} до 21:00 МСК`;
}

updateTimer();

setInterval(updateTimer,1000);

</script>

</body>
</html>
