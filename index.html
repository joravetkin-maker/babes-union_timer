<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Babes Union Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* УБИРАЕТ БЕЛЫЙ ФОН СТРАНИЦЫ */

html,
body{
  width:100%;
  height:100%;

  background:transparent !important;

  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:'Geologica',sans-serif;
}

/* УБИРАЕТ БЕЛЫЕ ОТСТУПЫ */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:transparent !important;
  pointer-events:none;
}

/* ГЛАВНЫЙ ВИДЖЕТ */

.widget{

  position:relative;

  width:320px;
  height:320px;

  border-radius:38px;

  overflow:hidden;

  background-color:transparent;

  background-image:url("https://i.ibb.co/JRbwjdX7/Chat-GPT-Image-19-2026-19-21-53.png");
  background-size:cover;
  background-position:center;

  box-shadow:none;

  flex-shrink:0;
}

/* ТАЙМЕР */

.timer{

  position:absolute;

  width:220px;

  left:50%;
  top:58%;

  transform:translate(-50%,-50%);

  text-align:center;
}

/* ОБЩИЙ СТИЛЬ ТЕКСТА */

.title,
.subtitle,
.number,
.label,
.deadline{

  color:#fff;

  -webkit-text-stroke:2px #000;

  paint-order:stroke fill;

  text-shadow:
    0 0 2px #000,
    0 0 4px #000;
}

/* ЗАГОЛОВОК */

.title{

  font-size:21px;
  font-weight:800;

  line-height:0.92;

  margin-bottom:18px;
}

/* ПОДЗАГОЛОВОК */

.subtitle{

  font-size:15px;
  font-weight:700;

  margin-bottom:20px;

  -webkit-text-stroke:1.3px #000;
}

/* БЛОК ЦИФР */

.numbers{

  display:flex;
  justify-content:center;

  gap:16px;

  margin-bottom:24px;
}

/* ОДНА КОЛОНКА */

.item{
  width:70px;
}

/* ЦИФРЫ */

.number{

  font-size:36px;
  font-weight:800;

  line-height:0.9;

  margin-bottom:3px;
}

/* ПОДПИСИ */

.label{

  font-size:12px;
  font-weight:700;

  text-transform:uppercase;

  -webkit-text-stroke:1px #000;
}

/* ДЕДЛАЙН */

.deadline{

  font-size:15px;
  font-weight:700;

  line-height:1.15;

  -webkit-text-stroke:1.2px #000;
}

/* ЭМОДЗИ БЕЗ ОБВОДКИ */

.subtitle,
.deadline{
  filter:none;
}

</style>
</head>

<body>

<div class="widget">

  <div class="timer">

    <div class="title" id="periodTitle">
      ОТЧЁТ<br>16–22 МАЯ
    </div>

    <div class="subtitle">
      ⛓️ Осталось до сдачи:
    </div>

    <div class="numbers">

      <div class="item">
        <div class="number" id="days">00</div>
        <div class="label">дни</div>
      </div>

      <div class="item">
        <div class="number" id="hours">00</div>
        <div class="label">часы</div>
      </div>

      <div class="item">
        <div class="number" id="minutes">00</div>
        <div class="label">минуты</div>
      </div>

      <div class="item">
        <div class="number" id="seconds">00</div>
        <div class="label">секунды</div>
      </div>

    </div>

    <div class="deadline" id="deadlineText">
      ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
    </div>

  </div>

</div>

<script>

function getCurrentPeriod(){

  const now = new Date();

  const year = now.getFullYear();
  const month = now.getMonth();
  const day = now.getDate();

  let start;
  let end;

  if(day <= 7){

    start = 1;
    end = 7;

  } else if(day <= 15){

    start = 8;
    end = 15;

  } else if(day <= 22){

    start = 16;
    end = 22;

  } else {

    start = 23;

    end = new Date(year, month + 1, 0).getDate();
  }

  return {start,end};
}

function updateTimer(){

  const now = new Date();

  const months = [
    "ЯНВАРЯ",
    "ФЕВРАЛЯ",
    "МАРТА",
    "АПРЕЛЯ",
    "МАЯ",
    "ИЮНЯ",
    "ИЮЛЯ",
    "АВГУСТА",
    "СЕНТЯБРЯ",
    "ОКТЯБРЯ",
    "НОЯБРЯ",
    "ДЕКАБРЯ"
  ];

  const period = getCurrentPeriod();

  const deadline = new Date(
    now.getFullYear(),
    now.getMonth(),
    period.end,
    21,
    0,
    0
  );

  const diff = deadline - now;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  const hours = Math.floor(
    (diff / (1000 * 60 * 60)) % 24
  );

  const minutes = Math.floor(
    (diff / (1000 * 60)) % 60
  );

  const seconds = Math.floor(
    (diff / 1000) % 60
  );

  document.getElementById("days").innerText =
    String(days).padStart(2,"0");

  document.getElementById("hours").innerText =
    String(hours).padStart(2,"0");

  document.getElementById("minutes").innerText =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").innerText =
    String(seconds).padStart(2,"0");

  document.getElementById("periodTitle").innerHTML =
    `ОТЧЁТ<br>${period.start}–${period.end} ${months[now.getMonth()]}`;

  document.getElementById("deadlineText").innerHTML =
    `⛓️‍💥 Дедлайн: ${period.end} ${months[now.getMonth()].toLowerCase()} до 21:00 МСК`;
}

updateTimer();

setInterval(updateTimer,1000);

</script>

</body>
</html>
