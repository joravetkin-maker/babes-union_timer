<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Babes Union Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:transparent;
  overflow:hidden;
  font-family:'Geologica',sans-serif;
}

/* ===== ВЕСЬ ВИДЖЕТ ===== */

.widget{
  position:relative;

  width:620px;
  aspect-ratio:1/1;

  border-radius:38px;
  overflow:hidden;

  background-image:url("https://i.ibb.co/JRbwjdX7/Chat-GPT-Image-19-2026-19-21-53.png");
  background-size:cover;
  background-position:center;

  transform-origin:center;
}

/* ===== ТАЙМЕР ===== */

.timer{
  position:absolute;

  left:50%;
  top:56%;

  transform:translate(-50%,-50%);

  width:72%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

/* ===== ЗАГОЛОВОК ===== */

.title{
  color:white;

  font-size:42px;
  font-weight:800;
  line-height:0.95;

  margin-bottom:20px;

  text-shadow:
    -4px -4px 0 #000,
     4px -4px 0 #000,
    -4px  4px 0 #000,
     4px  4px 0 #000;
}

/* ===== ПОДЗАГОЛОВОК ===== */

.subtitle{
  color:white;

  font-size:20px;
  font-weight:700;

  margin-bottom:26px;

  text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000;
}

/* ===== ЦИФРЫ ===== */

.numbers{
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:10px;

  margin-bottom:26px;
}

.item{
  flex:1;
}

/* ===== САМИ ЦИФРЫ ===== */

.number{
  color:white;

  font-size:72px;
  font-weight:800;
  line-height:0.9;

  margin-bottom:10px;

  text-shadow:
    -5px -5px 0 #000,
     5px -5px 0 #000,
    -5px  5px 0 #000,
     5px  5px 0 #000;
}

/* ===== ПОДПИСИ ===== */

.label{
  color:white;

  font-size:18px;
  font-weight:700;
  text-transform:uppercase;

  text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000;
}

/* ===== ДЕДЛАЙН ===== */

.deadline{
  color:white;

  font-size:22px;
  font-weight:700;
  line-height:1.15;

  text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000;
}

/* ===== АДАПТИВ ===== */

@media(max-width:700px){

  .widget{
    width:100vw;
    border-radius:28px;
  }

  .timer{
    width:78%;
    top:57%;
  }

  .title{
    font-size:32px;
  }

  .subtitle{
    font-size:16px;
  }

  .number{
    font-size:52px;
  }

  .label{
    font-size:13px;
  }

  .deadline{
    font-size:16px;
  }

}

</style>
</head>

<body>

<div class="widget">

  <div class="timer">

    <div class="title" id="periodTitle">
      ОТЧЁТ<br>16–22 МАЯ
    </div>

    <div class="subtitle">
      ⛓️ Осталось до сдачи:
    </div>

    <div class="numbers">

      <div class="item">
        <div class="number" id="days">00</div>
        <div class="label">дни</div>
      </div>

      <div class="item">
        <div class="number" id="hours">00</div>
        <div class="label">часы</div>
      </div>

      <div class="item">
        <div class="number" id="minutes">00</div>
        <div class="label">минуты</div>
      </div>

      <div class="item">
        <div class="number" id="seconds">00</div>
        <div class="label">секунды</div>
      </div>

    </div>

    <div class="deadline" id="deadlineText">
      ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
    </div>

  </div>

</div>

<script>

function getCurrentPeriod(){

  const now = new Date();

  const year = now.getFullYear();
  const month = now.getMonth();
  const day = now.getDate();

  let start,end;

  if(day <= 7){
    start = 1;
    end = 7;
  }
  else if(day <= 15){
    start = 8;
    end = 15;
  }
  else if(day <= 22){
    start = 16;
    end = 22;
  }
  else{
    start = 23;

    const lastDay = new Date(year, month + 1, 0).getDate();
    end = lastDay;
  }

  return {start,end};
}

function updateTimer(){

  const now = new Date();

  const months = [
    "ЯНВАРЯ","ФЕВРАЛЯ","МАРТА","АПРЕЛЯ",
    "МАЯ","ИЮНЯ","ИЮЛЯ","АВГУСТА",
    "СЕНТЯБРЯ","ОКТЯБРЯ","НОЯБРЯ","ДЕКАБРЯ"
  ];

  const period = getCurrentPeriod();

  const deadline = new Date(
    now.getFullYear(),
    now.getMonth(),
    period.end,
    21,0,0
  );

  const diff = deadline - now;

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("days").innerText =
    String(days).padStart(2,"0");

  document.getElementById("hours").innerText =
    String(hours).padStart(2,"0");

  document.getElementById("minutes").innerText =
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").innerText =
    String(seconds).padStart(2,"0");

  document.getElementById("periodTitle").innerHTML =
    `ОТЧЁТ<br>${period.start}–${period.end} ${months[now.getMonth()]}`;

  document.getElementById("deadlineText").innerHTML =
    `⛓️‍💥 Дедлайн: ${period.end} ${months[now.getMonth()].toLowerCase()} до 21:00 МСК`;
}

updateTimer();

setInterval(updateTimer,1000);

</script>

</body>
</html>
