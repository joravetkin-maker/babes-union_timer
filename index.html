<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Babes Union Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:transparent;
  overflow:hidden;

  font-family:'Geologica',sans-serif;
}

/* ОСНОВНОЙ ВИДЖЕТ */

.widget{

  position:relative;

  width:620px;
  height:620px;

  border-radius:42px;
  overflow:hidden;

  background-image:url("https://i.ibb.co/HLkfQzZM/background.png");

  background-size:cover;
  background-position:center;
}

/* ТОЛЬКО ПЛАШКА БЛЮРИТСЯ */

.card{

  position:absolute;

  width:290px;

  left:50%;
  bottom:70px;

  transform:translateX(-50%);

  padding:16px 12px;

  border-radius:28px;

  background:rgba(255,255,255,0.05);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  border:1px solid rgba(255,255,255,0.08);

  text-align:center;
}

/* ЗАГОЛОВОК */

.title{

  color:white;

  font-size:20px;
  font-weight:800;

  line-height:1.05;

  margin-bottom:8px;

  text-shadow:
  -3px -3px 0 #000,
   3px -3px 0 #000,
  -3px  3px 0 #000,
   3px  3px 0 #000;
}

/* ПОДЗАГОЛОВОК */

.subtitle{

  color:white;

  font-size:11px;
  font-weight:700;

  margin-bottom:12px;

  text-shadow:
  -2px -2px 0 #000,
   2px -2px 0 #000,
  -2px  2px 0 #000,
   2px  2px 0 #000;
}

/* БЛОК ЦИФР */

.numbers{

  display:flex;
  justify-content:center;

  gap:10px;

  margin-bottom:12px;
}

.item{
  min-width:50px;
}

/* ЦИФРЫ */

.number{

  color:white;

  font-size:34px;
  font-weight:800;

  line-height:1;

  text-shadow:
  -3px -3px 0 #000,
   3px -3px 0 #000,
  -3px  3px 0 #000,
   3px  3px 0 #000;
}

/* ПОДПИСИ */

.label{

  margin-top:4px;

  color:white;

  font-size:8px;
  font-weight:700;

  text-transform:uppercase;

  text-shadow:
  -2px -2px 0 #000,
   2px -2px 0 #000,
  -2px  2px 0 #000,
   2px  2px 0 #000;
}

/* ДЕДЛАЙН */

.deadline{

  color:white;

  font-size:10px;
  font-weight:700;

  line-height:1.2;

  text-shadow:
  -2px -2px 0 #000,
   2px -2px 0 #000,
  -2px  2px 0 #000,
   2px  2px 0 #000;
}

/* МОБИЛКА */

@media(max-width:700px){

  .widget{
    width:100vw;
    height:100vw;
    border-radius:34px;
  }

  .card{

    width:46%;

    bottom:10%;

    padding:12px 10px;
  }

  .title{
    font-size:18px;
  }

  .number{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="widget">

  <div class="card">

    <div class="title" id="periodTitle">
      ОТЧЁТ 16–22 МАЯ
    </div>

    <div class="subtitle">
      ⛓️ Осталось до сдачи:
    </div>

    <div class="numbers">

      <div class="item">
        <div class="number" id="days">00</div>
        <div class="label">дни</div>
      </div>

      <div class="item">
        <div class="number" id="hours">00</div>
        <div class="label">часы</div>
      </div>

      <div class="item">
        <div class="number" id="minutes">00</div>
        <div class="label">минуты</div>
      </div>

      <div class="item">
        <div class="number" id="seconds">00</div>
        <div class="label">секунды</div>
      </div>

    </div>

    <div class="deadline" id="deadlineText">
      ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
    </div>

  </div>

</div>

<script>

function updateTimer(){

  const now = new Date();

  const year = now.getFullYear();
  const month = now.getMonth();

  let period = {};

  const day = now.getDate();

  if(day <= 7){

    period = {
      start:1,
      end:7,
      deadline:new Date(year,month,7,21,0,0)
    };

  } else if(day <= 15){

    period = {
      start:8,
      end:15,
      deadline:new Date(year,month,15,21,0,0)
    };

  } else if(day <= 22){

    period = {
      start:16,
      end:22,
      deadline:new Date(year,month,22,21,0,0)
    };

  } else {

    const lastDay = new Date(year,month+1,0).getDate();

    period = {
      start:23,
      end:lastDay,
      deadline:new Date(year,month,lastDay,21,0,0)
    };

  }

  const diff = period.deadline - now;

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById('days').innerText =
    String(days).padStart(2,'0');

  document.getElementById('hours').innerText =
    String(hours).padStart(2,'0');

  document.getElementById('minutes').innerText =
    String(minutes).padStart(2,'0');

  document.getElementById('seconds').innerText =
    String(seconds).padStart(2,'0');

  const months = [
    'ЯНВАРЯ',
    'ФЕВРАЛЯ',
    'МАРТА',
    'АПРЕЛЯ',
    'МАЯ',
    'ИЮНЯ',
    'ИЮЛЯ',
    'АВГУСТА',
    'СЕНТЯБРЯ',
    'ОКТЯБРЯ',
    'НОЯБРЯ',
    'ДЕКАБРЯ'
  ];

  const monthName = months[now.getMonth()];

  document.getElementById('periodTitle').innerHTML =
    `ОТЧЁТ ${period.start}–${period.end}<br>${monthName}`;

  document.getElementById('deadlineText').innerHTML =
    `⛓️‍💥 Дедлайн: ${period.end} ${monthName.toLowerCase()} до 21:00 МСК`;

}

updateTimer();

setInterval(updateTimer,1000);

</script>

</body>
</html>
