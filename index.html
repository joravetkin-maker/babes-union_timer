<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Babes Union Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

body{
    font-family:'Geologica',sans-serif;
}

/* WIDGET */

.widget{

    position:relative;

    width:100%;

    max-width:620px;

    min-height:620px;

    overflow:hidden;

    border-radius:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    isolation:isolate;
}

/* BACKGROUND */

.bg{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    z-index:0;
}

/* OVERLAY */

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(0,0,0,0.06),
        rgba(0,0,0,0.16)
    );

    z-index:1;
}

/* CONTENT */

.content{

    position:relative;

    z-index:3;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:170px;
}

/* TIMER CARD */

.card{

    padding:10px 12px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.008);

    backdrop-filter:blur(8px);

    border:
    1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 8px 24px rgba(0,0,0,0.18);

    width:100%;

    max-width:340px;

    text-align:center;
}

/* TITLE */

.title{

    font-size:16px;

    line-height:1.05;

    font-weight:800;

    color:white;

    text-transform:uppercase;

    margin-bottom:8px;

    text-shadow:
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    2px 2px 0 #000,
    0 8px 18px rgba(0,0,0,0.45);
}

/* SUBTITLE */

.subtitle{

    font-size:11px;

    font-weight:700;

    color:white;

    margin-bottom:10px;

    text-shadow:
    -1.5px -1.5px 0 #000,
    1.5px -1.5px 0 #000,
    -1.5px 1.5px 0 #000,
    1.5px 1.5px 0 #000;
}

/* TIMER */

.timer{

    display:flex;

    gap:8px;

    justify-content:center;

    flex-wrap:wrap;

    margin-bottom:10px;
}

.time-box{

    min-width:54px;
}

.number{

    font-size:28px;

    font-weight:800;

    line-height:0.95;

    color:white;

    text-shadow:
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    2px 2px 0 #000,
    0 10px 18px rgba(0,0,0,0.45);
}

.label{

    margin-top:5px;

    font-size:9px;

    font-weight:600;

    color:white;

    text-shadow:
    -1px -1px 0 #000,
    1px -1px 0 #000,
    -1px 1px 0 #000,
    1px 1px 0 #000;
}

/* DEADLINE */

.deadline{

    font-size:11px;

    font-weight:700;

    color:white;

    text-shadow:
    -1.5px -1.5px 0 #000,
    1.5px -1.5px 0 #000,
    -1.5px 1.5px 0 #000,
    1.5px 1.5px 0 #000;
}

/* MOBILE */

@media(max-width:700px){

    .widget{

        min-height:540px;
    }

    .content{

        padding-top:150px;
    }

    .card{

        max-width:300px;
    }

    .number{

        font-size:24px;
    }

    .time-box{

        min-width:48px;
    }
}

</style>
</head>

<body>

<div class="widget">

    <!-- BACKGROUND -->
    <img
        class="bg"
        src="background.png"
        alt="background"
    >

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- CONTENT -->
    <div class="content">

        <div class="card">

            <div
                class="title"
                id="periodTitle"
            >
                ОТЧЁТ 16–22 МАЯ
            </div>

            <div class="subtitle">
                ⛓️ Осталось до сдачи:
            </div>

            <div class="timer">

                <div class="time-box">
                    <div class="number" id="days">00</div>
                    <div class="label">дни</div>
                </div>

                <div class="time-box">
                    <div class="number" id="hours">00</div>
                    <div class="label">часы</div>
                </div>

                <div class="time-box">
                    <div class="number" id="minutes">00</div>
                    <div class="label">минуты</div>
                </div>

                <div class="time-box">
                    <div class="number" id="seconds">00</div>
                    <div class="label">секунды</div>
                </div>

            </div>

            <div
                class="deadline"
                id="deadlineText"
            >
                ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
            </div>

        </div>

    </div>

</div>

<script>

const months = [
    'ЯНВАРЯ',
    'ФЕВРАЛЯ',
    'МАРТА',
    'АПРЕЛЯ',
    'МАЯ',
    'ИЮНЯ',
    'ИЮЛЯ',
    'АВГУСТА',
    'СЕНТЯБРЯ',
    'ОКТЯБРЯ',
    'НОЯБРЯ',
    'ДЕКАБРЯ'
];

function getDeadlineData(){

    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();
    const day = now.getDate();

    let deadline;
    let title;

    if(day >= 1 && day <= 7){

        deadline =
            new Date(
                year,
                month,
                7,
                21,
                0,
                0
            );

        title =
            `ОТЧЁТ 1–7 ${months[month]}`;
    }

    else if(day >= 8 && day <= 15){

        deadline =
            new Date(
                year,
                month,
                15,
                21,
                0,
                0
            );

        title =
            `ОТЧЁТ 8–15 ${months[month]}`;
    }

    else if(day >= 16 && day <= 22){

        deadline =
            new Date(
                year,
                month,
                22,
                21,
                0,
                0
            );

        title =
            `ОТЧЁТ 16–22 ${months[month]}`;
    }

    else{

        const lastDay =
            new Date(
                year,
                month + 1,
                0
            ).getDate();

        deadline =
            new Date(
                year,
                month,
                lastDay,
                21,
                0,
                0
            );

        title =
            `ОТЧЁТ 23–${lastDay} ${months[month]}`;
    }

    return {
        deadline,
        title
    };
}

function updateTimer(){

    const now = new Date();

    const {
        deadline,
        title
    } = getDeadlineData();

    let diff =
        deadline - now;

    if(diff < 0){

        location.reload();
        return;
    }

    const days =
        Math.floor(
            diff / 1000 / 60 / 60 / 24
        );

    const hours =
        Math.floor(
            diff / 1000 / 60 / 60
        ) % 24;

    const minutes =
        Math.floor(
            diff / 1000 / 60
        ) % 60;

    const seconds =
        Math.floor(
            diff / 1000
        ) % 60;

    document.getElementById('days').innerText =
        String(days).padStart(2,'0');

    document.getElementById('hours').innerText =
        String(hours).padStart(2,'0');

    document.getElementById('minutes').innerText =
        String(minutes).padStart(2,'0');

    document.getElementById('seconds').innerText =
        String(seconds).padStart(2,'0');

    document.getElementById('periodTitle').innerText =
        title;

    document.getElementById('deadlineText').innerText =
        `⛓️‍💥 Дедлайн: ${
            deadline.toLocaleDateString(
                'ru-RU',
                {
                    day:'numeric',
                    month:'long'
                }
            )
        } до 21:00 МСК`;
}

updateTimer();

setInterval(updateTimer,1000);

</script>

</body>
</html>
