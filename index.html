<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="widget">

  <div class="card">

    <div class="title" id="periodTitle">
      ОТЧЁТ 16–22 МАЯ
    </div>

    <div class="subtitle">
      ⛓️ Осталось до сдачи:
    </div>

    <div class="numbers">

      <div class="item">
        <div class="number" id="days">00</div>
        <div class="label">дни</div>
      </div>

      <div class="item">
        <div class="number" id="hours">00</div>
        <div class="label">часы</div>
      </div>

      <div class="item">
        <div class="number" id="minutes">00</div>
        <div class="label">минуты</div>
      </div>

      <div class="item">
        <div class="number" id="seconds">00</div>
        <div class="label">секунды</div>
      </div>

    </div>

    <div class="deadline" id="deadlineText">
      ⛓️‍💥 Дедлайн: 22 мая до 21:00 МСК
    </div>

  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
